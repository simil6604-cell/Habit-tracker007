name: CI

# Every push and every pull request. The tests in this repo are the reason it
# is safe to change anything here — running them only on a laptop means the
# one time they are skipped is the time they would have mattered.
on:
  push:
    branches: ["**"]
  pull_request:

# A second push to the same branch makes the first run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    env:
      # Absolute on purpose. Prisma resolves a relative `file:` URL against the
      # schema's own directory, not the working directory, so `file:./prisma/x.db`
      # would look for prisma/prisma/x.db — a real afternoon lost to that once.
      DATABASE_URL: file:${{ github.workspace }}/prisma/ci.db

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The Prisma client is generated code, not checked in, and both the app
      # and several tests import it.
      - run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:${{ github.workspace }}/prisma/test.db
      # This value never protects anything: the run is a throwaway container
      # with a throwaway database. The real one is generated by Render.
      AUTH_SECRET: ci-only-value-not-used-anywhere-real
      NEXTAUTH_URL: http://localhost:3100
      AUTH_URL: http://localhost:3100
      # No AI key on purpose — the suite tests the honest fallbacks that every
      # user sees when the AI is unreachable, and does so without spending
      # credit or depending on a network service.
      ANTHROPIC_API_KEY: ""

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      # Keyed on the installed Playwright version: a browser download is the
      # slowest part of this job and only changes when Playwright does.
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache browsers
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Builds the app and runs the suite against the production build, the
      # same way it runs locally (see playwright.config.ts).
      - name: End-to-end tests
        run: npm run test:e2e

      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
